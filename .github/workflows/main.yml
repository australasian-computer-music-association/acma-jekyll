name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Ruby series used for CI builds. Only the minor version is given, so the
      # latest patch release is used automatically. If this step fails with
      # "Unavailable version", bump this to a newer series (e.g. '4.1'), run
      # `bundle update` locally on that Ruby, and commit Gemfile.lock.
      # (.ruby-version is only used for local rbenv; keep it in the same series.)
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check _contributions entries
        run: |
          pip install pyyaml
          python3 scripts/check_contributions.py
      - name: build
        run: |
          bundle exec jekyll build
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: _site # The folder the action should deploy.
