# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

# Build settings
# Layouts, includes and styles live in this repo (_layouts, _includes, assets/css).
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# jekyll-seo-tag settings
twitter:
  username: acma89
author:
  type: Organization
  name: Australasian Computer Music Association
  twitter: acma89
social:
  name: Australasian Computer Music Association
  links:
    - https://twitter.com/acma89
    - https://www.facebook.com/acma89
    - https://www.instagram.com/aus_computer_music
    - https://github.com/australasian-computer-music-association

# 4. Jekyll settings
permalink: pretty  # Permalink style (/YYYY/MM/DD/page-name/)
excerpt_separator: <!-- more --> # Marks end of excerpt in posts
timezone: Australia/Canberra # Timezone for blog posts and alike

# Dotfiles Jekyll should still publish
include:
  - .htaccess

# Not part of the website (Jekyll's default excludes still apply)
exclude:
  - docs
  - scripts
  - README.md

# 5. Collections
collections:
  posts:
    title: Posts # Needed for Siteleaf
    output: true
    description: "News from the Australasian Computer Music Association" # The post list page content
  conferences:
    output: true
    permalink: /conferences/:path/
  minutes:
    output: true
    permalink: /minutes/:path/

# 6. Jekyll collections settings
defaults:
  -
    scope:
      path: ""
    values:
      image: "assets/images/acmc2019-concert-e1618799441533.jpg" # Default image for sharing
      seo_description_max_words: 24 # Keep auto-generated meta descriptions short
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: post # Set the default layout for posts
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: page # Set the default layout for pages
  -
    scope:
      path: _conferences
    values:
      layout: page
      seo:
        type: WebPage # not BlogPosting; _includes/event-schema.html adds Event data

# 7. Site settings
title: Australasian Computer Music Association
email: info@computermusic.org.au
tagline: Computer music since 1989 # used in the home page <title>
description: >- # default meta description (aim for under 160 characters)
  A community of composers, performers, researchers and technologists making music with computers in Australia and New Zealand. Home of ACMC and Chroma.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://computermusic.org.au" # the base hostname & protocol for your site, e.g. http://example.com
encoding: "UTF-8" # Make sure the encoding is right
lang: en-AU # Site language (Australian English)
logo: "/assets/logos/acma-logo-square-black.png" # Used by jekyll-seo-tag (search engines want a raster logo); the header uses the SVG
repo: "https://github.com/australasian-computer-music-association/acma-jekyll"

# 8. Site favicons. Syntax is 'size: path'
favicons:
  16: '/assets/logos/logo@16.png'
  32: '/assets/logos/logo@32.png'
  180: '/assets/logos/logo@180.png'
  192: '/assets/logos/logo@192.png'
  512: '/assets/logos/logo@512.png'

# 9. Site navigation
navigation_header:
- title: About
  url: /about/
- title: News
  url: /news/
- title: Chroma
  url: /chroma/
- title: Conference
  url: /conferences/
- title: Community
  url: /community/
- title: Committee
  url: /committee/
- title: Membership
  url: /membership/
- title: Search
  url: /search/

social_links: # Appears in the footer
  Twitter: https://twitter.com/acma89
  Facebook: https://www.facebook.com/acma89
  Instagram: https://www.instagram.com/aus_computer_music
  GitHub: https://github.com/australasian-computer-music-association
  RSS: /feed.xml
